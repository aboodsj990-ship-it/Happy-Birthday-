<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفاجأة خاصة 💗</title>
<style>
:root{--bg:#ef7183;--pink:#ffc4d4;--deep:#c83e68;--white:#fffafc;--ink:#73374c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 20% 15%,#ffb7c8 0 2px,transparent 3px),linear-gradient(145deg,#ed667c,#f49aaa 55%,#e95f7a);color:var(--white);display:grid;place-items:center;padding:18px;overflow-x:hidden}
body:before{content:"🦋　✿　♡　✿　🦋　♡";position:fixed;inset:8px 0 auto;text-align:center;font-size:24px;opacity:.8;letter-spacing:8px;pointer-events:none}
.card{width:min(100%,520px);background:#fff7faee;color:var(--ink);border:2px solid #fff;border-radius:28px;padding:26px 20px;box-shadow:0 18px 50px #7e203a44;text-align:center}
h1{font-size:clamp(25px,7vw,36px);margin:5px 0 18px;color:#b83b62}p{line-height:1.9}.small{font-size:13px;color:#a56b7e}
.slots{display:flex;direction:ltr;justify-content:center;gap:10px;margin:22px 0}.slot{width:54px;height:60px;border:2px solid #e9a2b7;border-radius:13px;background:white;font-size:28px;display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}.num{border:0;border-radius:50%;aspect-ratio:1;background:#fff;color:#c65a79;font-size:27px;box-shadow:0 5px 0 #e7a6b9;cursor:pointer}.action{border:0;border-radius:999px;background:#d84f77;color:white;padding:13px 24px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:14px}.answer{width:100%;border:1px solid #e8b4c4;border-radius:14px;background:white;color:#8e4962;padding:14px;margin:7px 0;font:inherit;cursor:pointer}.answer:active,.num:active{transform:scale(.97)}.progress{height:7px;background:#f4dce5;border-radius:99px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:#d84f77;width:0;transition:width .3s}.photo{width:100%;max-height:58vh;object-fit:contain;border:7px solid white;border-radius:18px;box-shadow:0 8px 25px #8d3d5840}.hidden{display:none}.dots{font-size:22px;letter-spacing:6px;color:#dc7894}
</style></head><body><main class="card" id="app"></main>
<script>
const C={"pass":"2026","welcome":"A Little Birthday Surprise 💗","intro":"في مفاجأة صغيرة مستنيّتك... جاهزة؟ 🌸","questions":["شو أكثر ذكرى حلوة بتتذكريها؟","لو نرجع لأول يوم، شو بتحكي؟","جاهزة للمفاجأة؟ 💗"],"photos":[],"finalTitle":"كل عام وإنتِ بخير! 🎂","finalMsg":"بتمنالك سنة مليانة فرح وراحة وأيام حلوة. يا رب تتحقق أمنياتك وتضلي مبسوطة دايماً. 💗"};
const app=document.getElementById('app');let entered='',qi=0,pi=0;
function showLock(){app.innerHTML='<div class="dots">🦋 ✿ 🦋</div><h1>ENTER A PASSCODE</h1><div class="slots">'+[0,1,2,3].map((_,i)=>'<div class="slot">'+(entered[i]?'●':'')+'</div>').join('')+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,'↺',0,'⌫'].map(n=>'<button class="num" data-key="'+n+'" onclick="tap(this.dataset.key)">'+n+'</button>').join('')+'</div><p class="small">a little secret, just between us ♡</p><p id="err" class="small"></p>';}
function tap(n){if(n==='↺')entered='';else if(n==='⌫')entered=entered.slice(0,-1);else if(entered.length<4)entered+=n;showLock();if(entered.length===4){if(entered===C.pass)setTimeout(showWelcome,250);else{document.getElementById('err').textContent='جرّبي مرة ثانية 💗';setTimeout(()=>{entered='';showLock()},850)}}}
function showWelcome(){app.innerHTML='<div class="dots">🌸 ♡ 🌸</div><h1>'+safe(C.welcome)+'</h1><p>'+safe(C.intro)+'</p><button class="action" onclick="showQuestion()">يلا نبدأ 💗</button>'}
function showQuestion(){if(qi>=C.questions.length){showGallery();return}app.innerHTML='<p class="small">سؤال '+(qi+1)+' من '+C.questions.length+'</p><div class="progress"><div class="bar" style="width:'+((qi+1)/C.questions.length*100)+'%"></div></div><h1>'+safe(C.questions[qi])+'</h1><p class="small">جاوبي براحتك، هاي أسئلة المفاجأة ♡</p><textarea id="reply" placeholder="اكتبي إجابتك هون..." style="width:100%;min-height:100px;border:1px solid #e8b4c4;border-radius:14px;padding:13px;font:inherit;background:white;color:#73374c"></textarea><br><button class="action" onclick="nextQ()">السؤال التالي</button>'}
function nextQ(){qi++;showQuestion()}
function showGallery(){if(!C.photos.length){showFinal();return}app.innerHTML='<div class="dots">♡ ذكريات حلوة ♡</div><h1>إلك هالصور 💗</h1><img class="photo" src="'+C.photos[pi]+'" alt="صورة من المفاجأة"><p class="small">'+(pi+1)+' / '+C.photos.length+'</p><button class="action" onclick="nextPhoto()">'+(pi===C.photos.length-1?'رسالة أخيرة':'الصورة التالية')+'</button>'}
function nextPhoto(){pi++;if(pi>=C.photos.length)showFinal();else showGallery()}
function showFinal(){app.innerHTML='<div class="dots">🎀 ✨ 🎂 ✨ 🎀</div><h1>'+safe(C.finalTitle)+'</h1><p>'+safe(C.finalMsg).replace(/\n/g,'<br>')+'</p><div class="dots">♡ ♡ ♡</div>'}
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
showLock();
</script></body></html>
